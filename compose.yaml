services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: memehub
      POSTGRES_USER: memehub
      POSTGRES_PASSWORD: change-me
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memehub -d memehub']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
